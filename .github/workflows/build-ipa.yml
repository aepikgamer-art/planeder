name: Build unsigned IPA (AltDirect-style)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26   # if unavailable on your account, change to macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Archive (unsigned)
        run: |
          set -o pipefail
          xcodebuild archive \
            -project Planeder.xcodeproj \
            -scheme Planeder \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/Planeder.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            | tee build.log | xcpretty || true

      - name: Show build log on failure
        if: failure()
        run: |
          if [ -f build.log ]; then
            tail -n 250 build.log
          else
            echo "no build.log (failed before archive)"
          fi

      - name: Package unsigned IPA
        id: ipa
        run: |
          mkdir -p build/Payload
          cp -R "build/Planeder.xcarchive/Products/Applications/Planeder.app" build/Payload/
          cd build
          zip -qry PlaneTinderUnsigned.ipa Payload
          IPA_SIZE=$(stat -f%z PlaneTinderUnsigned.ipa)
          echo "size=$IPA_SIZE" >> "$GITHUB_OUTPUT"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Planeder-unsigned-ipa
          path: build/PlaneTinderUnsigned.ipa
          if-no-files-found: error

      - name: Create GitHub release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then
            TAG="v$(date +%Y%m%d-%H%M%S)"
          fi
          gh release create "$TAG" build/PlaneTinderUnsigned.ipa \
            --title "Planeder $TAG (unsigned)" \
            --notes "Unsigned IPA. Install via AltStore/SideStore source, or download the IPA and sideload with your Apple ID." \
            --generate-notes
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Regenerate AltStore source.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.release.outputs.tag }}"
          IPA_URL="https://github.com/${{ github.repository }}/releases/download/$TAG/PlaneTinderUnsigned.ipa"
          DATE=$(date -u +"%Y-%m-%d")
          SIZE="${{ steps.ipa.outputs.size }}"
          mkdir -p docs
          cat > docs/source.json <<EOF
          {
            "name": "Planeder",
            "identifier": "dev.khyrie.planetinder.source",
            "website": "https://github.com/${{ github.repository }}",
            "apps": [
              {
                "bundleIdentifier": "dev.khyrie.planetinder",
                "name": "Planeder",
                "developerName": "khyrie",
                "subtitle": "Tinder for planes",
                "localizedDescription": "Swipe on planes. Photos and data from JetAPI (JetPhotos + FlightRadar24). Built in the cloud with GitHub Actions.",
                "tintColor": "1E90FF",
                "versions": [
                  {
                    "version": "$TAG",
                    "date": "$DATE",
                    "localizedDescription": "Unsigned cloud build $TAG.",
                    "downloadURL": "$IPA_URL",
                    "size": ${{ steps.ipa.outputs.size }}
                  }
                ]
              }
            ]
          }
          EOF
          python3 -c "import json;json.load(open('docs/source.json'))" && echo "source.json valid"

      - name: Commit updated source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/source.json
          git commit -m "chore: refresh AltStore source for ${{ steps.release.outputs.tag }}" || echo "nothing to commit"
          git push
